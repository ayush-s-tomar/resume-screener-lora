name: eval

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - data/**
      - resume-screener-lora-adapter/**
      - requirements*.txt
      - .github/workflows/eval.yml
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - data/**
      - resume-screener-lora-adapter/**
      - requirements*.txt
      - .github/workflows/eval.yml
  workflow_dispatch: {}
  schedule:
    - cron: 17 3 * * 1
concurrency:
  group: eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen2.5-0.5b-instruct-v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pylint

      - name: Validate JSONL datasets
        run: |
          python -c "
          import json, sys
          for f in ['data/train.jsonl', 'data/eval.jsonl']:
              with open(f, encoding='utf-8') as fh:
                  for i, line in enumerate(fh, 1):
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          json.loads(line)
                      except json.JSONDecodeError as e:
                          print(f'{f}:{i} invalid JSON: {e}')
                          sys.exit(1)
              print(f'{f}: OK')
          "

      - name: Lint with pylint
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          pylint --jobs=0 inference.py --disable=all --enable=E --exit-zero

      - name: Run baseline vs fine-tuned comparison
        run: |
          python -u compare_baseline_vs_finetuned.py
        env:
          EVAL_LIMIT: "${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '10' || '4' }}"
        continue-on-error: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
