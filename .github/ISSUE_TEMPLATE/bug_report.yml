name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste real resumes or personal data; use fictional text.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect and what did you get?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands or inputs that show the problem.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Operating system, Python version, and whether you used the local adapter or the hosted demo.
