services:
  - type: web
    name: resume-screener-lora
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: HF_TOKEN
        sync: false
      - key: MALLOC_ARENA_MAX
        value: "2"
