<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume checker pilot: a 10-minute survey</title>
<style>
body{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:#0f1020;color:#e8e9f3;margin:0;padding:24px;display:flex;justify-content:center}
.wrap{max-width:760px;width:100%}
h1{font-size:22px;margin:0 0 12px}
p.intro{line-height:1.55;color:#c5c7dc}
fieldset.q{border:1px solid #2a2c4a;border-radius:12px;margin:14px 0;padding:12px 16px;background:#17182d}
legend{padding:0 6px;font-weight:600}
.help{color:#8f92b8;font-size:13px;margin:4px 0}
label.opt{display:block;margin:6px 0;cursor:pointer}
.scale{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0}
.scale label.opt{display:inline-block}
label.check{display:block;background:#17182d;border:1px solid #3a3d63;border-radius:12px;padding:12px 16px;margin:16px 0;line-height:1.5}
input[type=number],textarea{width:100%;box-sizing:border-box;background:#0f1020;color:inherit;border:1px solid #3a3d63;border-radius:8px;padding:10px;font-size:15px;font-family:inherit}
input[type=number]{max-width:160px}
button{font-size:16px;padding:12px 18px;border-radius:10px;border:1px solid #3a3d63;background:#23254a;color:#e8e9f3;cursor:pointer;margin:6px 8px 6px 0}
button:hover{background:#2d3060}
.msg{color:#fca5a5;margin:10px 0}
.out{margin:16px 0}
pre{white-space:pre-wrap;word-wrap:break-word;background:#17182d;border:1px solid #2a2c4a;border-radius:10px;padding:12px;font-size:13px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var DATA = {"version": 1, "title": "Resume checker pilot: a 10-minute survey", "intro": ["I am a B.Tech student building a small research project, a resume screening model called resume-screener-lora. I would like to know whether it is useful to students who are about to apply for jobs, and where it is wrong.", "What you do (about 10 minutes): open the demo at https://resume-screener-finetune.onrender.com, choose one of the sample resumes or paste your own resume with the mask option ticked (names and addresses are not masked, so remove them if you prefer), decide what you expect BEFORE you press the button, run it, then answer this form.", "Your data: this form asks for no name, email or phone number and keeps nothing on a server. Your answers stay in your browser until you download a small file and send it to me. I will publish only combined results. Please do not write personal details in the comment box. The file has no name on it, so I cannot remove your answers once you have sent it; if you change your mind, simply do not send the file.", "The demo sends the text you submit to a third-party service (Groq) to be scored; its Privacy panel explains what is kept. If you are not comfortable using your own resume, use a sample one: that is just as useful to me.", "This is a research demo, not a hiring tool. Its scores can be wrong, and they say nothing about your worth or your chances. Taking part is voluntary and you can stop at any time."], "consent": "I am 18 or older, I have read the above, I understand that this is a student research project and that taking part is voluntary, and I agree that my answers (which contain no name or contact details) are combined with others and published as aggregate results.", "questions": [{"id": "year", "type": "choice", "label": "Which year of study are you in?", "required": false, "options": [["1", "1st year"], ["2", "2nd year"], ["3", "3rd year"], ["4", "4th year"], ["grad", "Already graduated"], ["other", "Other"]]}, {"id": "role_family", "type": "choice", "label": "Which kind of role did you try?", "required": true, "options": [["backend", "Backend"], ["frontend", "Frontend"], ["data", "Data"], ["ai", "AI or machine learning"], ["devops", "DevOps"], ["software", "General software developer"], ["other", "Something else"]]}, {"id": "resume_used", "type": "choice", "label": "Which resume did you use?", "required": true, "options": [["own_masked", "My own, with the mask option on"], ["own_unmasked", "My own, without the mask option"], ["sample", "One of the sample (fictional) resumes"], ["fictional", "Another fictional resume I wrote or found"]]}, {"id": "input_method", "type": "choice", "label": "How did the text get into the demo?", "required": true, "options": [["sample_button", "With a sample button"], ["pasted", "I pasted text"], ["uploaded", "I uploaded a file"]]}, {"id": "self_fit", "type": "choice", "label": "BEFORE you pressed the button: how well did you think this resume fits the role you entered?", "required": true, "help": "Please answer this before you look at the result.", "options": [["strong", "A strong fit"], ["moderate", "A moderate fit"], ["weak", "A weak fit"], ["unsure", "I am not sure"]]}, {"id": "score", "type": "number", "label": "The score shown (0 to 100)", "required": true, "min": 0, "max": 100}, {"id": "verdict", "type": "choice", "label": "The verdict shown", "required": true, "options": [["strong", "Strong match"], ["moderate", "Moderate match"], ["weak", "Weak match"]]}, {"id": "badge", "type": "choice", "label": "Did you see a 'borderline' badge on the result?", "required": false, "options": [["yes", "Yes"], ["no", "No, the result had no badge"], ["none_exists", "I did not see any badge feature on the page"]]}, {"id": "l_verdict", "type": "scale", "label": "The verdict matched my own judgement.", "required": true, "min": 1, "max": 5, "low": "strongly disagree", "high": "strongly agree"}, {"id": "l_matched", "type": "scale", "label": "The matched skills it listed were correct.", "required": true, "min": 1, "max": 5, "low": "strongly disagree", "high": "strongly agree"}, {"id": "l_missing", "type": "scale", "label": "The missing skills it listed were useful to me (things I lack or should add).", "required": true, "min": 1, "max": 5, "low": "strongly disagree", "high": "strongly agree"}, {"id": "l_new", "type": "scale", "label": "The result told me something I did not already know.", "required": true, "min": 1, "max": 5, "low": "strongly disagree", "high": "strongly agree"}, {"id": "l_again", "type": "scale", "label": "I would use a tool like this again to check a resume before applying.", "required": true, "min": 1, "max": 5, "low": "strongly disagree", "high": "strongly agree"}, {"id": "comfort", "type": "choice", "label": "How did the result make you feel about your resume?", "required": true, "options": [["more_confident", "More confident"], ["no_change", "No change"], ["a_bit_worried", "A bit worried"], ["discouraged", "Discouraged"]]}, {"id": "trust_decisions", "type": "choice", "label": "Would you trust a tool like this to decide who gets an interview?", "required": true, "options": [["yes", "Yes"], ["no", "No"], ["unsure", "Not sure"]]}, {"id": "comment", "type": "text", "label": "Anything that looked wrong or confusing? (No personal details, please.)", "required": false, "max": 300}]};
var answers = {};
function h(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) { e.className = cls; }
  if (text !== undefined) { e.textContent = text; }
  return e;
}
function radio(q, value, label) {
  var l = h('label', 'opt');
  var i = h('input');
  i.type = 'radio';
  i.name = q.id;
  i.value = String(value);
  i.onchange = function () { answers[q.id] = value; };
  l.appendChild(i);
  l.appendChild(document.createTextNode(' ' + label));
  return l;
}
function renderQuestion(q) {
  var box = h('fieldset', 'q');
  box.id = 'q_' + q.id;
  box.appendChild(h('legend', '', q.label + (q.required ? ' *' : '')));
  if (q.help) { box.appendChild(h('div', 'help', q.help)); }
  if (q.type === 'choice') {
    q.options.forEach(function (o) { box.appendChild(radio(q, o[0], o[1])); });
  } else if (q.type === 'scale') {
    var row = h('div', 'scale');
    for (var v = q.min; v <= q.max; v++) { row.appendChild(radio(q, v, String(v))); }
    box.appendChild(row);
    box.appendChild(h('div', 'help', q.min + ' = ' + q.low + ', ' + q.max + ' = ' + q.high));
  } else if (q.type === 'number') {
    var n = h('input');
    n.type = 'number';
    n.min = q.min;
    n.max = q.max;
    n.oninput = function () { if (n.value === '') { delete answers[q.id]; } else { answers[q.id] = Number(n.value); } };
    box.appendChild(n);
  } else {
    var t = h('textarea');
    t.maxLength = q.max || 300;
    t.rows = 3;
    t.oninput = function () { var s = t.value.trim(); if (s) { answers[q.id] = s; } else { delete answers[q.id]; } };
    box.appendChild(t);
  }
  return box;
}
function render() {
  var app = document.getElementById('app');
  app.appendChild(h('h1', '', DATA.title));
  DATA.intro.forEach(function (p) { app.appendChild(h('p', 'intro', p)); });
  var consent = h('label', 'check');
  var cb = h('input');
  cb.type = 'checkbox';
  cb.id = 'consent';
  consent.appendChild(cb);
  consent.appendChild(document.createTextNode(' ' + DATA.consent));
  app.appendChild(consent);
  DATA.questions.forEach(function (q) { app.appendChild(renderQuestion(q)); });
  var btn = h('button', '', 'Finish and get my answers file');
  btn.type = 'button';
  btn.onclick = finish;
  app.appendChild(btn);
  var msg = h('div', 'msg');
  msg.id = 'msg';
  app.appendChild(msg);
  var out = h('div', 'out');
  out.id = 'out';
  app.appendChild(out);
}
function finish() {
  var missing = [];
  if (!document.getElementById('consent').checked) { missing.push('the consent box at the top'); }
  DATA.questions.forEach(function (q) {
    var v = answers[q.id];
    if (q.required && v === undefined) { missing.push(q.label); }
    if (q.type === 'number' && v !== undefined && (isNaN(v) || v < q.min || v > q.max)) { missing.push(q.label + ' (a number from ' + q.min + ' to ' + q.max + ')'); }
  });
  var msg = document.getElementById('msg');
  if (missing.length) { msg.textContent = 'Please complete: ' + missing.join(' | '); return; }
  msg.textContent = '';
  var id = '';
  try {
    var bytes = new Uint8Array(4);
    crypto.getRandomValues(bytes);
    for (var k = 0; k < bytes.length; k++) { id += ('0' + bytes[k].toString(16)).slice(-2); }
  } catch (e) {
    id = String(Math.random()).slice(2, 10);
  }
  var data = { version: DATA.version, id: id, created: new Date().toISOString().slice(0, 10), consent: true, answers: answers };
  var json = JSON.stringify(data, null, 2);
  var out = document.getElementById('out');
  out.textContent = '';
  out.appendChild(h('p', 'intro', 'Thank you. Click the button to save your answers as a small file, then send that file to me. If the download does not work, copy the text below into a file named pilot_' + id + '.json instead.'));
  var dl = h('button', '', 'Download my answers');
  dl.type = 'button';
  dl.onclick = function () {
    var blob = new Blob([json], { type: 'application/json' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'pilot_' + id + '.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };
  out.appendChild(dl);
  out.appendChild(h('pre', '', json));
}
render();
</script>
</body>
</html>
